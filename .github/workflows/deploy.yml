name: Deploy to Cloudflare Workers
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Remove _redirects (SPA handled by wrangler config)
        run: rm -f dist/public/_redirects

      # Install the pinned wrangler once so the reconciler script can shell
      # out to it (it uses `npx wrangler` under the hood). Also keeps the
      # version aligned with the cloudflare/wrangler-action steps below.
      - name: Install wrangler (for reconciler)
        run: npm install --no-save --no-audit --no-fund wrangler@4.85.0

      # Auto-stamp the d1_migrations ledger for any pending migration whose
      # schema work is already present in the live database. This protects
      # against the "ledger drifted from schema" failure mode (see
      # migrations/README.md). It is a no-op when the ledger is in sync.
      - name: Reconcile D1 migrations ledger
        run: >
          node script/reconcile-d1-migrations.mjs
          --database savvy-admin
          --config wrangler-workers.toml

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.85.0"
          command: d1 migrations apply savvy-admin --remote --config wrangler-workers.toml

      - name: Verify ledger and schema agree (post-apply)
        run: >
          node script/reconcile-d1-migrations.mjs
          --database savvy-admin
          --config wrangler-workers.toml
          --dry-run
          --require-in-sync

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.85.0"
          command: deploy --config wrangler-workers.toml

      - name: Install email worker dependencies
        run: npm ci --prefix worker/email-worker --no-audit --no-fund

      - name: Deploy email worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.85.0"
          workingDirectory: worker/email-worker
          command: deploy
